<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản | OnboardAI</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/admin-user-management.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="page page--admin-user-management" data-page="admin-user-management">
    <div class="app-shell is-collapsed">
      <header class="app-header" id="app-header">
      </header>
      <aside class="app-sidebar" id="app-sidebar">
      </aside>
      <main class="app-main" id="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Quản lý tài khoản</h1>
            <p class="page-header__description">Tài khoản hệ thống, vai trò và phòng ban được phân công.</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" type="button" data-action="open-user-form">Thêm tài khoản</button>
          </div>
        </div>
        <div class="page-body">
          <section class="card" aria-label="Danh sách tài khoản">
            <form class="toolbar" data-region="user-filters" role="search">
              <div class="toolbar__search form-field">
                <label class="form-field__label" for="user-search">Tài khoản</label>
                <input class="form-field__control" id="user-search" name="search" type="search" placeholder="Nhập tên hoặc email…" value="">
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="user-role">Vai trò</label>
                <select class="form-field__control" id="user-role" name="role">
                  <option value="" selected="">Tất cả vai trò</option>
                  <option value="newHire">Nhân sự mới</option>
                  <option value="mentor">Người hướng dẫn</option>
                  <option value="hr">Nhân sự</option>
                  <option value="admin">Quản trị viên</option>
                </select>
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="user-status">Trạng thái</label>
                <select class="form-field__control" id="user-status" name="status">
                  <option value="" selected="">Tất cả</option>
                  <option value="active">Hoạt động</option>
                  <option value="invited">Chờ kích hoạt</option><option value="inactive">Vô hiệu hóa</option>
                </select>
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="user-department">Phòng ban</label>
                <select class="form-field__control" id="user-department" name="departmentId">
                  <option value="" selected="">Tất cả phòng ban</option>
                </select>
              </div>
            </form>
            <div data-region="user-state" aria-live="polite" class="view-state" role="status" aria-busy="false" hidden="">
            </div>
            <div class="table-wrap" data-region="user-table">
              <table class="table">
                <caption class="sr-only">Danh sách tài khoản hệ thống</caption>
                <thead>
                  <tr>
                    <th scope="col">Tài khoản</th>
                    <th scope="col">Vai trò</th>
                    <th scope="col">Phòng ban</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Thao tác</th>
                  </tr>
                </thead>
                <tbody data-region="user-rows"></tbody>
              </table>
            </div>
            <p class="form-field__hint admin-users__summary" data-region="user-summary" aria-live="polite"></p>
          </section>
        </div>
      </main>
    </div>
    <template data-template="open-user-form" data-title="Tài khoản"><form class="form" novalidate><div class="form__grid"><div class="form-field"><label class="form-field__label" for="edit-fullName">Họ và tên</label><input class="form-field__control" id="edit-fullName" name="fullName" type="text" value="" required  ><p class="form-field__error" data-error-for="fullName" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-email">Email</label><input class="form-field__control" id="edit-email" name="email" type="email" value="" required  ><p class="form-field__error" data-error-for="email" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-password">Mật khẩu (để trống khi không đổi)</label><input class="form-field__control" id="edit-password" name="password" type="password" value=""   ><p class="form-field__error" data-error-for="password" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-role">Vai trò</label><select class="form-field__control" id="edit-role" name="role" ><option value="newHire">Nhân sự mới</option><option value="mentor">Mentor</option><option value="hr">HR</option><option value="admin">Admin</option></select><p class="form-field__error" data-error-for="role" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-departmentId">Phòng ban</label><select class="form-field__control" id="edit-departmentId" name="departmentId" ></select><p class="form-field__error" data-error-for="departmentId" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-jobTitle">Chức danh</label><input class="form-field__control" id="edit-jobTitle" name="jobTitle" type="text" value=""   ><p class="form-field__error" data-error-for="jobTitle" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-status">Trạng thái</label><select class="form-field__control" id="edit-status" name="status" ><option value="active">Hoạt động</option><option value="inactive">Ngừng hoạt động</option><option value="invited">Chờ kích hoạt</option></select><p class="form-field__error" data-error-for="status" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-mentorId">Mentor</label><select class="form-field__control" id="edit-mentorId" name="mentorId" ></select><p class="form-field__error" data-error-for="mentorId" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-journeyId">Hành trình</label><select class="form-field__control" id="edit-journeyId" name="journeyId" ></select><p class="form-field__error" data-error-for="journeyId" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-startDate">Ngày bắt đầu</label><input class="form-field__control" id="edit-startDate" name="startDate" type="date" value=""   ><p class="form-field__error" data-error-for="startDate" hidden></p></div></div><div class="form__actions"><button type="button" class="btn btn--secondary">Hủy</button><button type="submit" class="btn btn--primary">Lưu</button></div></form></template>
    <div id="modal-root">
    </div>
    <div id="toast-root" aria-live="polite">
    </div>
    <script type="module" src="../js/main.js">
    </script>
  </body>
</html>
