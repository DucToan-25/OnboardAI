<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý hành trình | OnboardAI</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/hr-journey-management.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="page page--hr-journey-management" data-page="hr-journey-management" data-display-name="Nguyễn Thu Hà" data-layout-role="hr">
    <div class="app-shell is-collapsed">
      <header class="app-header" id="app-header">
      </header>
      <aside class="app-sidebar" id="app-sidebar">
      </aside>
      <main class="app-main" id="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Quản lý hành trình</h1>
            <p class="page-header__description">Mẫu hành trình hội nhập và việc gán nhân sự theo từng mẫu.</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" type="button" data-action="open-journey-form">Tạo hành trình</button>
          </div>
        </div>
        <div class="page-body">
          <section class="card" aria-label="Danh sách mẫu hành trình">
            <form class="toolbar" data-region="journey-filters" role="search">
              <div class="toolbar__search form-field">
                <label class="form-field__label" for="journey-search">Tên hành trình</label>
                <input class="form-field__control" id="journey-search" name="search" type="search" placeholder="Nhập tên hành trình…" value="">
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="journey-status">Trạng thái</label>
                <select class="form-field__control" id="journey-status" name="status">
                  <option value="" selected="">Tất cả</option>
                  <option value="draft">Bản nháp</option>
                  <option value="active">Đang áp dụng</option>
                  <option value="archived">Đã lưu trữ</option>
                </select>
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="journey-department">Phòng ban</label>
                <select class="form-field__control" id="journey-department" name="departmentId">
                  <option value="" selected="">Tất cả phòng ban</option>
                  <option value="dep-dev">Phát triển sản phẩm</option>
                  <option value="dep-sales">Kinh doanh</option>
                  <option value="dep-hr">Nhân sự</option>
                </select>
              </div>
            </form>
            <div data-region="journey-state" aria-live="polite" class="view-state" role="status" aria-busy="false" hidden="">
            </div>
            <div class="table-wrap" data-region="journey-table">
              <table class="table">
                <caption class="sr-only">Mẫu hành trình hội nhập</caption>
                <thead>
                  <tr>
                    <th scope="col">Hành trình</th>
                    <th scope="col">Phòng ban</th>
                    <th scope="col" class="table__cell--numeric">Số bước</th>
                    <th scope="col" class="table__cell--numeric">Nhân sự gán</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Thao tác</th>
                  </tr>
                </thead>
                <tbody data-region="journey-rows">
                  <tr data-id="journey-001">
                    <td>
                      <strong>Hội nhập phát triển web</strong>
                    </td>
                    <td>Phát triển sản phẩm</td>
                    <td class="table__cell--numeric">3</td>
                    <td class="table__cell--numeric">1</td>
                    <td>
                      <span class="badge badge--success">Đang áp dụng</span>
                    </td>
                    <td class="table__actions">
                      <button type="button" class="btn btn--ghost btn--sm" data-action="view-journey" data-id="journey-001">Chi tiết</button>
                      <button type="button" class="btn btn--secondary btn--sm" data-action="edit-journey" data-id="journey-001">Sửa</button>
                      <button type="button" class="btn btn--danger btn--sm" data-action="archive-journey" data-id="journey-001">Lưu trữ</button>
                    </td>
                  </tr>
                  <tr data-id="journey-002">
                    <td>
                      <strong>Hội nhập kinh doanh</strong>
                    </td>
                    <td>Kinh doanh</td>
                    <td class="table__cell--numeric">2</td>
                    <td class="table__cell--numeric">1</td>
                    <td>
                      <span class="badge badge--success">Đang áp dụng</span>
                    </td>
                    <td class="table__actions">
                      <button type="button" class="btn btn--ghost btn--sm" data-action="view-journey" data-id="journey-002">Chi tiết</button>
                      <button type="button" class="btn btn--secondary btn--sm" data-action="edit-journey" data-id="journey-002">Sửa</button>
                      <button type="button" class="btn btn--danger btn--sm" data-action="archive-journey" data-id="journey-002">Lưu trữ</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p class="form-field__hint hr-journeys__summary" data-region="journey-summary" aria-live="polite">2 / 2 mẫu hành trình</p>
          </section>
        </div>
      </main>
    </div>
    <template data-template="open-journey-form" data-title="Tạo mẫu hành trình">
      <div>
        <form class="form" novalidate="">
          <div class="form__grid">
            <div class="form-field">
              <label class="form-field__label" for="field-name-1">
                Tên hành trình
                <span class="form-field__required" aria-hidden="true">*</span>
              </label>
              <input type="text" class="form-field__control" id="field-name-1" name="name" required="" aria-describedby="field-name-1-error" value="">
              <p class="form-field__error" id="field-name-1-error" data-error-for="name" hidden="">
              </p>
            </div>
            <div class="form-field">
              <label class="form-field__label" for="field-departmentId-2">
                Phòng ban
                <span class="form-field__required" aria-hidden="true">*</span>
              </label>
              <select class="form-field__control" id="field-departmentId-2" name="departmentId" required="" aria-describedby="field-departmentId-2-error">
                <option value="" selected="">— Chọn phòng ban —</option>
                <option value="dep-dev">Phát triển sản phẩm</option>
                <option value="dep-sales">Kinh doanh</option>
                <option value="dep-hr">Nhân sự</option>
              </select>
              <p class="form-field__error" id="field-departmentId-2-error" data-error-for="departmentId" hidden="">
              </p>
            </div>
            <div class="form-field">
              <label class="form-field__label" for="field-status-3">Trạng thái</label>
              <select class="form-field__control" id="field-status-3" name="status" aria-describedby="field-status-3-error">
                <option value="draft" selected="">Bản nháp</option>
                <option value="active">Đang áp dụng</option>
                <option value="archived">Đã lưu trữ</option>
              </select>
              <p class="form-field__error" id="field-status-3-error" data-error-for="status" hidden="">
              </p>
            </div>
            <div class="form-field">
              <label class="form-field__label" for="field-steps-4">Các bước mẫu</label>
              <textarea class="form-field__control" id="field-steps-4" name="steps" aria-describedby="field-steps-4-error field-steps-4-hint"></textarea>
              <p class="form-field__error" id="field-steps-4-error" data-error-for="steps" hidden="">
              </p>
              <p class="form-field__hint" id="field-steps-4-hint">Mỗi bước một dòng.</p>
            </div>
          </div>
          <div class="alert alert--info" hidden="">
            </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--secondary">Hủy</button>
            <button type="submit" class="btn btn--primary">Tạo hành trình</button>
          </div>
        </form>
      </div>
    </template>
    <div id="modal-root">
    </div>
    <div id="toast-root" aria-live="polite">
    </div>
    <script type="module" src="../js/main.js">
    </script>
  </body>
</html>
