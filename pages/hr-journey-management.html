<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý hành trình | OnboardAI</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/hr-journey-management.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="page page--hr-journey-management" data-page="hr-journey-management">
    <div class="app-shell is-collapsed">
      <header class="app-header" id="app-header">
      </header>
      <aside class="app-sidebar" id="app-sidebar">
      </aside>
      <main class="app-main" id="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Quản lý hành trình</h1>
            <p class="page-header__description">Mẫu hành trình hội nhập và việc gán nhân sự theo từng mẫu.</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" type="button" data-action="open-journey-form">Tạo hành trình</button>
          </div>
        </div>
        <div class="page-body">
          <section class="card" aria-label="Danh sách mẫu hành trình">
            <form class="toolbar" data-region="journey-filters" role="search">
              <div class="toolbar__search form-field">
                <label class="form-field__label" for="journey-search">Tên hành trình</label>
                <input class="form-field__control" id="journey-search" name="search" type="search" placeholder="Nhập tên hành trình…" value="">
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="journey-status">Trạng thái</label>
                <select class="form-field__control" id="journey-status" name="status">
                  <option value="" selected="">Tất cả</option>
                  <option value="active">Đang áp dụng</option>
                  <option value="inactive">Ngừng áp dụng</option>
                </select>
              </div>
            </form>
            <div data-region="journey-state" aria-live="polite" class="view-state" role="status" aria-busy="false" hidden="">
            </div>
            <div class="table-wrap" data-region="journey-table">
              <table class="table">
                <caption class="sr-only">Mẫu hành trình hội nhập</caption>
                <thead>
                  <tr>
                    <th scope="col">Hành trình</th>
                    <th scope="col">Phòng ban</th>
                    <th scope="col" class="table__cell--numeric">Thời lượng (ngày)</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Thao tác</th>
                  </tr>
                </thead>
                <tbody data-region="journey-rows"></tbody>
              </table>
            </div>
            <p class="form-field__hint hr-journeys__summary" data-region="journey-summary" aria-live="polite"></p>
          </section>
<section class="card" data-region="hire-management"><div class="card__header"><h2 class="card__title">Hồ sơ hội nhập và phân công</h2><button class="btn btn--primary" type="button" data-action="create-hire">Tạo hồ sơ</button></div><div class="form-field"><label class="form-field__label" for="hire-search">Tìm nhân sự</label><input id="hire-search" class="form-field__control" type="search" data-region="hire-search"></div><div data-region="hire-state" aria-live="polite"></div><div class="table-wrap"><table class="table"><thead><tr><th>Nhân sự</th><th>Mentor</th><th>Hành trình</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody data-region="hire-rows"></tbody></table></div></section>
        </div>
      </main>
    </div>
    <template data-template="open-journey-form" data-title="Hành trình"><form class="form" novalidate><div class="form__grid"><div class="form-field"><label class="form-field__label" for="edit-title">Tên hành trình</label><input class="form-field__control" id="edit-title" name="title" type="text" value="" required  ><p class="form-field__error" data-error-for="title" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-description">Mô tả</label><textarea class="form-field__control" id="edit-description" name="description" ></textarea><p class="form-field__error" data-error-for="description" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-departmentId">Phòng ban</label><select class="form-field__control" id="edit-departmentId" name="departmentId" ></select><p class="form-field__error" data-error-for="departmentId" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-targetRole">Đối tượng</label><input class="form-field__control" id="edit-targetRole" name="targetRole"  type="text" placeholder="all" required><p class="form-field__error" data-error-for="targetRole" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-durationDays">Thời lượng (ngày)</label><input class="form-field__control" id="edit-durationDays" name="durationDays" type="number" value="" required min="1" ><p class="form-field__error" data-error-for="durationDays" hidden></p></div></div><div class="form__actions"><button type="button" class="btn btn--secondary">Hủy</button><button type="submit" class="btn btn--primary">Lưu</button></div></form></template>
<template data-template="open-hire-form"><form class="form" novalidate><div class="form__grid"><div class="form-field"><label class="form-field__label" for="hire-userId">Tài khoản</label><select class="form-field__control" id="hire-userId" name="userId" required></select><p class="form-field__error" data-error-for="userId" hidden></p></div><div class="form-field"><label class="form-field__label" for="hire-mentorId">Mentor</label><select class="form-field__control" id="hire-mentorId" name="mentorId" ></select><p class="form-field__error" data-error-for="mentorId" hidden></p></div><div class="form-field"><label class="form-field__label" for="hire-journeyId">Hành trình</label><select class="form-field__control" id="hire-journeyId" name="journeyId" ></select><p class="form-field__error" data-error-for="journeyId" hidden></p></div><div class="form-field"><label class="form-field__label" for="hire-startDate">Ngày bắt đầu</label><input class="form-field__control" id="hire-startDate" name="startDate" type="date"><p class="form-field__error" data-error-for="startDate" hidden></p></div><div class="form-field"><label class="form-field__label" for="hire-status">Trạng thái</label><select class="form-field__control" id="hire-status" name="status" ><option value="notStarted">Chưa bắt đầu</option><option value="inProgress">Đang hội nhập</option><option value="completed">Hoàn thành</option><option value="archived">Đã lưu trữ</option></select><p class="form-field__error" data-error-for="status" hidden></p></div><div class="form-field"><label class="form-field__label" for="hire-notes">Ghi chú</label><textarea class="form-field__control" id="hire-notes" name="notes"></textarea><p class="form-field__error" data-error-for="notes" hidden></p></div></div><div class="form__actions"><button class="btn btn--secondary" type="button">Hủy</button><button class="btn btn--primary" type="submit">Lưu hồ sơ</button></div></form></template><div id="modal-root">
    </div>
    <div id="toast-root" aria-live="polite">
    </div>
    <script type="module" src="../js/main.js">
    </script>
  </body>
</html>
