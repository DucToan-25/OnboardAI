<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thư viện tài liệu | OnboardAI</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/hr-document-library.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="page page--hr-document-library" data-page="hr-document-library">
    <div class="app-shell is-collapsed">
      <header class="app-header" id="app-header">
      </header>
      <aside class="app-sidebar" id="app-sidebar">
      </aside>
      <main class="app-main" id="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Thư viện tài liệu</h1>
            <p class="page-header__description">Tài liệu và sổ tay dùng chung theo quyền của bạn.</p>
          </div>
          <div class="page-header__actions" data-region="library-actions">
            <button class="btn btn--primary btn--sm" type="button" data-action="open-document-form">Thêm tài liệu</button>
          </div>
        </div>
        <div class="page-body" data-region="library-page">
          <section class="card">
            <div class="card__header">
              <h2 class="card__title">Danh sách tài liệu</h2>
              <span class="form-field__hint" data-region="document-count">—</span>
            </div>
            <form class="toolbar" data-region="document-filters" role="search">
              <div class="form-field toolbar__search">
                <label class="form-field__label" for="document-search">Tìm tài liệu</label>
                <input class="form-field__control" id="document-search" name="search" type="search" placeholder="Nhập tên tài liệu" value="">
              </div>
              <div class="form-field toolbar__filters">
                <label class="form-field__label" for="document-category">Chủ đề</label>
                <select class="form-field__control" id="document-category" name="category"><option value="">Tất cả chủ đề</option></select>
              </div>
              <div class="form-field toolbar__filters">
                <label class="form-field__label" for="document-status">Trạng thái</label>
                <select class="form-field__control" id="document-status" name="status">
                  <option value="" selected="">Tất cả trạng thái</option>
                  <option value="draft">Bản nháp</option>
                  <option value="active">Đã phát hành</option>
                  <option value="archived">Đã lưu trữ</option>
                </select>
              </div>
            </form>
            <div data-region="library-state" aria-live="polite" class="view-state" role="status" aria-busy="false" hidden="">
            </div>
            <div class="table-wrap" data-region="document-table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Tài liệu</th>
                    <th scope="col">Chủ đề</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Cập nhật</th>
                    <th scope="col">Thao tác</th>
                  </tr>
                </thead>
                <tbody data-region="document-rows"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <template data-template="open-document-form" data-title="Tài liệu"><form class="form" novalidate><div class="form__grid"><div class="form-field"><label class="form-field__label" for="edit-title">Tiêu đề</label><input class="form-field__control" id="edit-title" name="title" type="text" value="" required  ><p class="form-field__error" data-error-for="title" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-category">Chủ đề</label><input class="form-field__control" id="edit-category" name="category" type="text" value="" required  ><p class="form-field__error" data-error-for="category" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-description">Mô tả</label><textarea class="form-field__control" id="edit-description" name="description" ></textarea><p class="form-field__error" data-error-for="description" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-fileUrl">Đường dẫn tệp HTTP(S) hoặc assets/docs/</label><input class="form-field__control" id="edit-fileUrl" name="fileUrl" type="text" value=""   ><p class="form-field__error" data-error-for="fileUrl" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-departmentId">Phòng ban</label><select class="form-field__control" id="edit-departmentId" name="departmentId" ></select><p class="form-field__error" data-error-for="departmentId" hidden></p></div><div class="form-field"><label class="form-field__label" for="edit-targetRole">Đối tượng</label><select class="form-field__control" id="edit-targetRole" name="targetRole" ><option value="all">Toàn công ty</option><option value="newhire">Nhân sự mới</option><option value="engineer">Kỹ sư</option><option value="mentor">Mentor</option><option value="hr">HR</option><option value="admin">Admin</option></select><p class="form-field__error" data-error-for="targetRole" hidden></p></div></div><div class="form__actions"><button type="button" class="btn btn--secondary">Hủy</button><button type="submit" class="btn btn--primary">Lưu</button></div></form></template>
    <div id="modal-root">
    </div>
    <div id="toast-root" aria-live="polite">
    </div>
    <script type="module" src="../js/main.js">
    </script>
  </body>
</html>
