<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checklist nhiệm vụ | OnboardAI</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/newhire-checklist.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body class="page page--newhire-checklist" data-page="newhire-checklist">
    <div class="app-shell is-collapsed">
      <header class="app-header" id="app-header">
      </header>
      <aside class="app-sidebar" id="app-sidebar">
      </aside>
      <main class="app-main" id="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Checklist nhiệm vụ</h1>
            <p class="page-header__description">Theo dõi công việc trong hành trình hội nhập của bạn.</p>
          </div>
        </div>
        <p class="form-field__hint">Mở nhiệm vụ để tạo hoặc sửa ghi chú/kết quả và cập nhật trạng thái. Mentor có thể xem kết quả đã lưu.</p>
        <div class="page-body">
          <section class="card" aria-label="Danh sách nhiệm vụ">
            <div class="toolbar">
              <div class="toolbar__search form-field">
                <label class="form-field__label" for="checklist-search">Tên nhiệm vụ</label>
                <input class="form-field__control" id="checklist-search" name="search" type="search" placeholder="Nhập tên nhiệm vụ…" data-region="search" value="">
              </div>
              <div class="toolbar__filters form-field">
                <label class="form-field__label" for="checklist-status">Trạng thái</label>
                <select class="form-field__control" id="checklist-status" name="status" data-region="status-filter"><option value="">Tất cả</option></select>
              </div>
            </div>
            <div class="nh-checklist__progress" data-region="task-progress">
              <div class="progress">
                <div class="progress__label">
                  <span data-region="label"></span>
                  <span class="progress__value" data-region="percent"></span>
                </div>
                <progress class="progress__bar" max="100" aria-label="Tiến độ hội nhập" value="0">
                </progress>
              </div>
            </div>
            <div data-region="task-state" aria-live="polite" class="view-state" role="status" aria-busy="false" hidden="">
            </div>
            <div class="table-wrap" data-region="task-table">
              <table class="table">
                <caption class="sr-only">Nhiệm vụ hội nhập</caption>
                <thead>
                  <tr>
                    <th scope="col">Nhiệm vụ</th>
                    <th scope="col">Hạn hoàn thành</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Thao tác</th>
                  </tr>
                </thead>
                <tbody data-region="journey-tasks"></tbody>
              </table>
            </div>
            <p class="nh-checklist__summary" data-region="task-summary" aria-live="polite"></p>
          </section>
        </div>
      </main>
    </div>

    <template data-template="open-task" data-title="Chi tiết nhiệm vụ">
      <form class="form" novalidate="">
        <div data-region="task-badge"></div>
        <h3 class="nh-checklist__detail-heading" data-region="task-title"></h3>
        <div class="alert alert--info">
          <p class="alert__title" data-region="task-due"></p>
          <p class="alert__message">Cập nhật trạng thái nhiệm vụ của bạn.</p>
        </div>
        <p class="nh-checklist__detail-description" data-region="description"></p>
        <h3 class="nh-checklist__detail-heading">Tiến độ của bạn</h3>
        <div class="form__grid" data-region="result-fields"></div>
        <div class="form__actions">
          <button class="btn btn--secondary" type="button" data-action="cancel-task-result">Hủy</button>
          <button class="btn btn--primary" type="submit" data-action="submit-task-result" hidden="">Lưu trạng thái</button>
        </div>
      </form>
    </template>
    <div id="modal-root">
    </div>
    <div id="toast-root" aria-live="polite">
    </div>
    <script type="module" src="../js/main.js">
    </script>
  </body>
</html>
